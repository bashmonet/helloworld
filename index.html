<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="A playful dinosaur mouth-clicking counter."
    />
    <meta name="theme-color" content="#101d18" />
    <title>Chomp Counter</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23dfff47'/%3E%3Cpath d='M10 29c5-13 17-19 31-16 8 2 13 7 13 14-8-3-15-2-20 3 7 0 13 3 17 8-6 11-21 15-33 8C9 41 7 35 10 29Z' fill='%231d6b4f'/%3E%3Ccircle cx='38' cy='23' r='4' fill='%23fff'/%3E%3Ccircle cx='39' cy='23' r='2' fill='%23101d18'/%3E%3Cpath d='m28 35 5 6 5-6 5 6' fill='none' stroke='%23fff8dc' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Chomp Counter home">
          <span class="brand-mark" aria-hidden="true">C</span>
          <span>CHOMP COUNTER</span>
        </a>
        <div class="score-chip" aria-label="Total mouth clicks">
          <span class="score-label">CHOMPS</span>
          <strong id="score" aria-live="polite">0</strong>
        </div>
      </header>

      <section class="game-card" aria-labelledby="game-title">
        <div class="intro">
          <p class="eyebrow">SPECIMEN 001 · T. REX</p>
          <h1 id="game-title">Wake the<br /><em>roarsaurus.</em></h1>
          <p class="instructions">
            Tap the glowing mouth. Every chomp adds to your score.
          </p>
        </div>

        <div class="play-zone">
          <div class="orbit orbit-one" aria-hidden="true"></div>
          <div class="orbit orbit-two" aria-hidden="true"></div>
          <div class="burst" id="burst" aria-hidden="true">CHOMP!</div>
          <div class="dino-frame" id="dinoFrame">
            <div class="dino-sprite" role="img" aria-label="A friendly green dinosaur"></div>
            <button
              class="mouth-trigger"
              id="mouthTrigger"
              type="button"
              aria-label="Open the dinosaur's mouth and add one chomp"
            >
              <span>Tap mouth</span>
            </button>
          </div>
        </div>

        <footer class="game-footer">
          <div>
            <span class="footer-label">CURRENT STREAK</span>
            <strong><span id="footerScore">0</span> mighty chomps</strong>
          </div>
          <p>Your score stays on this device.</p>
        </footer>
      </section>
    </main>
  </body>
</html>
